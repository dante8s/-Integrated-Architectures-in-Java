spring.application.name=Integrated_Architectures
server.port=8081

# Datasource is configured automatically from compose.yaml (spring-boot-docker-compose).
# Keep the container running between restarts instead of stopping it every time.
spring.docker.compose.lifecycle-management=start-only

# Schema is owned by Flyway (src/main/resources/db/migration); Hibernate only checks it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
