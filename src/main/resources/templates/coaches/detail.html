<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<!-- The page title is the coach's name: head(title) accepts any expression -->
<head th:replace="~{fragments/layout :: head(${coach.fullName})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-5" style="max-width: 800px">
    <a th:href="@{/coaches}" class="d-inline-block mb-3">&larr; Back to all coaches</a>

    <!-- coach is a CoachView (from CoachCatalogController.detail) -->
    <div class="card">
        <div class="card-body p-4">
            <h1 class="h2 mb-2" th:text="${coach.fullName}">Ivan Petrenko</h1>
            <div class="mb-3">
                <span th:each="sportName : ${coach.sportNames}" class="badge text-bg-secondary me-1"
                      th:text="${sportName}">Tennis</span>
            </div>

            <dl class="row mb-4">
                <dt class="col-sm-3">Experience</dt>
                <dd class="col-sm-9" th:text="${coach.experienceYears} + ' years'">5 years</dd>
                <dt class="col-sm-3">Price</dt>
                <dd class="col-sm-9 fw-semibold" th:text="${coach.hourlyPrice} + ' / hour'">25.00 / hour</dd>
                <dt class="col-sm-3">Where</dt>
                <dd class="col-sm-9">
                    <span th:text="${coach.city} ?: 'no city'">Kyiv</span>
                    <span th:if="${coach.online}" class="badge text-bg-info ms-1">online</span>
                </dd>
            </dl>

            <h2 class="h5">About</h2>
            <!-- white-space: pre-line keeps the line breaks the coach typed in the bio -->
            <p th:if="${coach.bio}" th:text="${coach.bio}" style="white-space: pre-line">Full bio</p>
            <p th:unless="${coach.bio}" class="text-muted">The coach hasn't written about themselves yet.</p>

            <!-- Free slots are on a separate page of the booking/ package (StudentBookingController) -->
            <a th:href="@{/coaches/{id}/slots(id=${coach.id})}" class="btn btn-primary">See free time and book</a>

            <!-- Reviews are on a separate page of the review/ package (ReviewController) -->
            <a th:href="@{/coaches/{id}/reviews(id=${coach.id})}" class="btn btn-outline-secondary ms-2">Reviews</a>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
