<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Registration complete')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-5" style="max-width: 720px">
    <!-- registeredAsCoach comes as a flash attribute from the redirect -->
    <div th:if="${registeredAsCoach}" class="alert alert-info">
        <h4 class="alert-heading">Thank you for registering!</h4>
        <p class="mb-0">Your coach profile is waiting for administrator approval.
            You will be able to log in after it is approved.</p>
    </div>
    <div th:unless="${registeredAsCoach}" class="alert alert-success">
        <h4 class="alert-heading">Registration complete!</h4>
        <p class="mb-0">You can now log in and find a coach.</p>
    </div>
    <a th:href="@{/}" class="btn btn-outline-secondary">Back to home</a>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
