<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Log in')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-5" style="max-width: 420px">
    <h1 class="mb-4">Log in</h1>

    <!-- ${param.x} is true when the URL has ?x (SecurityConfig redirects here with these parameters) -->
    <div th:if="${param.error}" class="alert alert-danger">Wrong email or password.</div>
    <div th:if="${param.pending}" class="alert alert-warning">
        Your coach profile is waiting for administrator approval. Please try again later.
    </div>
    <div th:if="${param.rejected}" class="alert alert-danger">
        Your coach profile was rejected by the administrator.
    </div>
    <div th:if="${param.logout}" class="alert alert-success">You have been logged out.</div>

    <!-- th:action (not plain action) adds the hidden CSRF token; POST /login is handled by Spring Security -->
    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" name="email" required autofocus>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" name="password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Log in</button>
    </form>

    <p class="mt-3 text-center small">
        No account yet?
        <a th:href="@{/register/student}">Register as student</a> or
        <a th:href="@{/register/coach}">as coach</a>.
    </p>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
