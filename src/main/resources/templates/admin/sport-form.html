<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<!-- One template for create and edit: "sportId" is in the model only when editing. -->
<head th:replace="~{fragments/layout :: head(${sportId} ? 'Edit sport' : 'New sport')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-5" style="max-width: 560px">
    <h1 class="mb-4" th:text="${sportId} ? 'Edit sport' : 'New sport'">New sport</h1>

    <!-- create -> POST /admin/sports, edit -> POST /admin/sports/{id} -->
    <form th:action="${sportId} ? @{/admin/sports/{id}(id=${sportId})} : @{/admin/sports}"
          th:object="${form}" method="post" novalidate>
        <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input type="text" class="form-control" th:field="*{name}" th:errorclass="is-invalid">
            <div class="invalid-feedback" th:errors="*{name}"></div>
        </div>
        <div class="mb-3">
            <label for="description" class="form-label">Description <span class="text-muted">(optional)</span></label>
            <textarea class="form-control" rows="3" th:field="*{description}" th:errorclass="is-invalid"></textarea>
            <div class="invalid-feedback" th:errors="*{description}"></div>
        </div>

        <button type="submit" class="btn btn-primary">Save</button>
        <a th:href="@{/admin/sports}" class="btn btn-link">Cancel</a>
    </form>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
