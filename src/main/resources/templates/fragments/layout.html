<!DOCTYPE html>
<!-- Reusable pieces of every page. Usage: th:replace="~{fragments/layout :: navbar}" -->
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' · SportCoach'">SportCoach</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap JS: modals, dropdowns. defer = run after the page is parsed -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
</head>

<body>

<nav th:fragment="navbar" class="navbar navbar-expand navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">SportCoach</a>
        <ul class="navbar-nav ms-auto align-items-center">
            <!-- Guests: register + log in -->
            <li class="nav-item" sec:authorize="isAnonymous()">
                <a class="nav-link" th:href="@{/register/student}">Register as student</a>
            </li>
            <li class="nav-item" sec:authorize="isAnonymous()">
                <a class="nav-link" th:href="@{/register/coach}">Register as coach</a>
            </li>
            <li class="nav-item" sec:authorize="isAnonymous()">
                <a class="btn btn-outline-light btn-sm ms-2" th:href="@{/login}">Log in</a>
            </li>

            <!-- Admin only -->
            <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                <a class="nav-link" th:href="@{/admin/coaches}">Coach approval</a>
            </li>
            <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                <a class="nav-link" th:href="@{/admin/sports}">Sports</a>
            </li>

            <!-- Logged-in users: name + log out -->
            <li class="nav-item" sec:authorize="isAuthenticated()">
                <a class="nav-link" th:href="@{/profile}" sec:authentication="principal.firstName">Name</a>
            </li>
            <li class="nav-item" sec:authorize="isAuthenticated()">
                <!-- Logout is POST with the CSRF token (th:action adds it), not a plain link -->
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-outline-light btn-sm ms-2">Log out</button>
                </form>
            </li>
        </ul>
    </div>
</nav>

<footer th:fragment="footer" class="border-top py-3 mt-5">
    <div class="container text-muted small">SportCoach · bachelor thesis project</div>
</footer>

</body>
</html>
